<!DOCTYPE html>
<html lang="pt-BR">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KVVXKDN2JT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KVVXKDN2JT');
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AzureCalc Pro | Fortune 500 Edition{% endblock %}</title>
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-xl font-bold text-blue-600 dark:text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-cloud"></i> AzureCalc Pro
            </div>
            <div class="flex items-center gap-3">
                <a href="/" class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400" data-i18n="nav_calc">Calculadora</a>
                <button id="lang-toggle" class="ml-2 px-2 py-1 flex items-center gap-1 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all text-xs font-bold">
                    <i class="fa-solid fa-globe"></i> <span id="lang-toggle-text">PT-BR</span>
                </button>
                <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        <div id="adsense-top" class="w-full min-h-[90px] mb-8 flex justify-center"></div>
        {% block content %}{% endblock %}
        <div id="adsense-bottom" class="w-full min-h-[90px] mt-12 flex justify-center"></div>
    </main>

    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 mt-auto transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500 dark:text-slate-400" data-i18n="footer_copy">
            &copy; 2026 AzureCalc Pro. Projeto Independente.
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        if (html.classList.contains('dark')) themeIcon.classList.replace('fa-moon', 'fa-sun');
        themeBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            if(html.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark'); themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                localStorage.setItem('theme', 'light'); themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
